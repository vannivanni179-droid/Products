<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProductDitial</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <section
      id="card-container"
      class="container mx-auto p-5 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"
    >
    
      <p id="loading-msg" class="col-span-full text-center text-gray-500">
        Loading products…
      </p>
    </section>

    
    <div
      id="product-modal"
      class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-4"
    >
      <div
        class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto relative p-6"
      >
        <button
          id="modal-close"
          class="absolute top-4 right-4 text-gray-500 hover:text-black text-2xl leading-none"
          aria-label="Close"
        >
          &times;
        </button>
        <div id="modal-body" class="flex flex-col sm:flex-row gap-6">
      
        </div>
      </div>
    </div>

   
    <script src="./fetchData.js"></script>
   
    <script src="./productDitial.js"></script>
  </body>
</html>
